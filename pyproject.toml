[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-diagnostics"
version = "0.1.0"
description = "Protótipo acadêmico de observabilidade e diagnóstico de sistemas distribuídos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "psutil>=7,<8",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "etcd3gw>=2.5,<3",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-psutil>=7,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py312"
line-length = 100
src = ["app", "tests"]
include = ["app/**/*.py", "tests/**/*.py", "scripts/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
cache_dir = ".cache/mypy"
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts"]

[project.scripts]
diagnostics = "app.cli:main"

[[tool.mypy.overrides]]
module = ["etcd3gw.*"]
ignore_missing_imports = true
